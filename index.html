<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Market Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M1 12 L5 7 L9 9 L15 3' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  </head>
  <body>
    <div class="app">
      <aside class="explorer">
        <header class="explorer-head">
          <div class="venue">
            <div id="exchange" class="seg" role="radiogroup" data-i18n-attr="aria-label:venue.label">
              <button type="button" role="radio" data-ex="kraken">Kraken</button>
              <button type="button" role="radio" data-ex="binance">Binance</button>
              <button type="button" role="radio" data-ex="coinbase">Coinbase</button>
            </div>
            <div id="quote" class="seg" role="radiogroup" data-i18n-attr="aria-label:quote.label">
              <button type="button" role="radio" data-q="EUR">EUR</button>
              <button type="button" role="radio" data-q="USD">USD</button>
            </div>
          </div>
          <div class="search">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
            <input id="search" type="search" data-i18n-attr="placeholder:search.placeholder;aria-label:search.placeholder" autocomplete="off" spellcheck="false" />
            <kbd aria-hidden="true">/</kbd>
          </div>
          <div class="tabs" role="tablist" data-i18n-attr="aria-label:tabs.label">
            <button role="tab" data-view="fav"><span data-i18n="tab.fav"></span> <span id="fav-count" class="count"></span></button>
            <button role="tab" data-view="crypto" data-i18n="tab.crypto"></button>
            <button role="tab" data-view="stock" data-i18n="tab.stock"></button>
            <button role="tab" data-view="etf" data-i18n="tab.etf" data-i18n-attr="title:tab.etf.title"></button>
          </div>
        </header>
        <div class="cols">
          <span></span>
          <button data-sort="name" data-i18n="col.name"></button>
          <button data-sort="price" data-i18n="col.price"></button>
          <button data-sort="change" data-i18n="col.change"></button>
          <button data-sort="volume" class="vol" data-i18n="col.volume" data-i18n-attr="title:col.volume.title"></button>
        </div>
        <ul id="list" class="list" role="listbox" tabindex="0" data-i18n-attr="aria-label:list.label"></ul>
        <p id="list-msg" class="list-msg" hidden></p>
        <footer class="explorer-foot">
          <span id="hint" class="hint"></span>
          <span id="status" class="status" role="status"></span>
          <button id="lang" class="icon-btn lang-btn" type="button"></button>
          <button id="theme" class="icon-btn" type="button"></button>
        </footer>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </aside>

      <main class="details">
        <p id="d-empty" class="d-empty" data-i18n="d.empty"></p>
        <article id="d-body" hidden>
          <header class="d-head">
            <div>
              <h1 class="d-title"><span id="d-name"></span> <span id="d-sym" class="sym"></span></h1>
              <p class="d-pair"><span id="d-pair"></span> · <a id="d-trade" target="_blank" rel="noopener noreferrer"></a></p>
            </div>
            <button id="d-star" class="star big" type="button"></button>
          </header>
          <div class="d-price">
            <span id="d-last" class="num"></span>
            <span id="d-chg" class="num"></span>
          </div>
          <section class="chart" data-i18n-attr="aria-label:chart.label">
            <div class="chart-bar">
              <span id="readout" class="readout num"></span>
              <div id="tf" class="tf" role="radiogroup" data-i18n-attr="aria-label:tf.label"></div>
            </div>
            <div class="compare">
              <div id="legend" class="legend"></div>
              <button id="cmp-add" class="cmp-add" type="button" data-i18n="cmp.add" data-i18n-attr="title:cmp.addTitle"></button>
              <input id="cmp-input" class="cmp-input" list="cmp-options" autocomplete="off" spellcheck="false" hidden data-i18n-attr="placeholder:cmp.placeholder;aria-label:cmp.placeholder" />
              <datalist id="cmp-options"></datalist>
            </div>
            <div class="chart-box">
              <canvas id="chart" tabindex="0" role="img" data-i18n-attr="aria-label:chart.canvas"></canvas>
              <div id="chart-msg" class="chart-msg" hidden></div>
            </div>
            <p id="chart-note" class="chart-note"></p>
          </section>
          <section class="stats-wrap">
            <h2 class="stats-title" data-i18n="stats.title"></h2>
            <dl id="stats" class="stats"></dl>
            <p id="sources" class="sources"></p>
          </section>
        </article>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
